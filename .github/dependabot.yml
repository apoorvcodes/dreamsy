# Weekly dependency updates. Minor and patch bumps come grouped in one PR per ecosystem; majors come one by one.
# Vendored libraries in third_party/ are not tracked here: update them by hand (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace: root package.json + pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy/fly
    schedule:
      interval: weekly
